[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-mapping-platform"
version = "0.1.0"
description = "Extensible 2D robot scan mapping with auditable loop closures"
requires-python = ">=3.10"

[project.scripts]
robot-mapping-demo = "robot_mapping.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
