[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-mapping-platform"
version = "0.1.0"
description = "Extensible 2D robot mapping platform with reviewable loop closures"
requires-python = ">=3.10"

[project.scripts]
robot-map = "robot_mapping.cli:main"

[tool.setuptools.packages.find]
include = ["robot_mapping*"]
